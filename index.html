<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Landing Page - Candidato Ronaldo</title>
</head>

<body>

    <header class="header">
        <img class="img" src="img/Adesivo Política Corporativo Azul.svg" alt="img">
    </header>

    <main class="content">
        <p>
            Comprometido em garantir educação, saúde, segurança e emprego digno para todos.
            Juntos, podemos construir.
        </p>
        <div class="video-container" id="videoContainer">
            <div class="video-frame">
                <iframe id="videoIframe" src="https://www.youtube.com/embed/9DOjDumNtPU" title="RONALDO REELS"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                <button class="expand-button" id="expandButton">⤢</button>
            </div>
        </div>
        <button class="button">Entre no grupo</button>
    </main>

    <footer class="footer">
        <div class="social-icons">
            <a href="https://www.instagram.com/ronaldo27007/" target="_blank"><img src="img/instagram.svg"
                    alt="Instagram"></a>
            <a href="https://www.facebook.com/ronaldo.martinsribeiro" target="_blank"><img src="img/facebook.svg"
                    alt="Facebook"></a>
            <a href="https://wa.me/5515997538167" target="_blank"><img src="img/whatsapp.svg" alt="WhatsApp"></a>
        </div>
        <div class="icon-marquee">
            <div class="icon">
                <img src="img/famia-icone.svg" alt="Icone 1">
            </div>
            <div class="icon">
                <img src="img/educacao.svg" alt="Icone 2">
            </div>
            <div class="icon">
                <img src="img/icone-saude.svg" alt="Icone 3">
            </div>
            <div class="icon">
                <img src="img/icone de segurança.svg" alt="Icone 4">
            </div>
            <div class="icon">
                <img src="img/icone-trabalho.svg" alt="Icone 5">
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const marquee = document.querySelector('.icon-marquee');
            const totalIconsWidth = marquee.scrollWidth;
            marquee.innerHTML += marquee.innerHTML;
            let scrollPosition = 0;
            const scrollSpeed = 1 * 0.5;

            function marqueeAnimation() {
                scrollPosition += scrollSpeed;
                if (scrollPosition >= totalIconsWidth) {
                    scrollPosition = 0;
                }
                marquee.scrollLeft = scrollPosition;
                requestAnimationFrame(marqueeAnimation);
            }

            marqueeAnimation();

            // Video expansion
            const videoContainer = document.getElementById('videoContainer');
            const videoIframe = document.getElementById('videoIframe');
            const content = document.querySelector('.content');

            videoContainer.addEventListener('click', (e) => {
                if (!videoContainer.classList.contains('expanded')) {
                    videoContainer.classList.add('expanded');
                    e.stopPropagation();
                    // Store the current src
                    const currentSrc = videoIframe.src;
                    // Reload the iframe to force it to resize
                    videoIframe.src = currentSrc;
                }
            });

            document.body.addEventListener('click', (e) => {
                if (videoContainer.classList.contains('expanded') && !videoContainer.contains(e.target)) {
                    videoContainer.classList.remove('expanded');
                    // Store the current src
                    const currentSrc = videoIframe.src;
                    // Reload the iframe to force it to resize
                    videoIframe.src = currentSrc;
                }
            });
            const expandButton = document.getElementById('expandButton');

            expandButton.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleVideoExpansion();
            });

            function toggleVideoExpansion() {
                videoContainer.classList.toggle('expanded');
                if (videoContainer.classList.contains('expanded')) {
                    expandButton.textContent = '⤓';
                } else {
                    expandButton.textContent = '⤢';
                }
                // Store the current src
                const currentSrc = videoIframe.src;
                // Reload the iframe to force it to resize
                videoIframe.src = currentSrc;
            }
        });
    </script>
</body>

</html>
